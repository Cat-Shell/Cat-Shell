name: 🐱 Cat-Shell CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: cat_shell_Linux
            cmd: g++ -std=c++17 src/main.cpp src/commands.cpp -o cat_shell_Linux
          - os: windows-latest
            artifact_name: cat_shell_Windows.exe
            cmd: g++ -std=c++17 src/main.cpp src/commands.cpp -o cat_shell_Windows.exe
          - os: macos-latest
            artifact_name: cat_shell_macOS
            cmd: g++ -std=c++17 src/main.cpp src/commands.cpp -o cat_shell_macOS

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Cat-Shell
      run: |
        ${{ matrix.cmd }}

    - name: Smoke test (non-Windows)
      if: runner.os != 'Windows'
      run: |
        echo "exit" | ./${{ matrix.artifact_name }}

    - name: Smoke test (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "exit" | ./${{ matrix.artifact_name }}

    - name: Prepare artifact folder
      shell: bash
      run: |
        mkdir -p dist
        mv ${{ matrix.artifact_name }} dist/

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}
        path: dist/*
        retention-days: 1

  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: binary-*
        path: release_assets
        merge-multiple: true

    - name: Recreate main tag
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -d main || true
        git push origin :refs/tags/main || true
        sleep 3
        git tag main
        git push origin refs/tags/main --force

    - name: Upload binaries to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: main
        files: release_assets/*
        name: "Cat-Shell Rolling Build"
        body: "Automated build for Linux, Windows and macOS. The tag is updated on every push to main that touches source code."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

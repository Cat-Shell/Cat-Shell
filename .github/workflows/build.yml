name: 🐱 Cat-Shell CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/*.yml'

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            make: make
            artifact_name: cat_shell_Linux
          - os: windows-latest
            make: mingw32-make
            artifact_name: cat_shell_Windows.exe
          - os: macos-latest
            make: make
            artifact_name: cat_shell_macOS

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Cat-Shell
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ${{ matrix.make }} CXXFLAGS="-std=c++17 -Wall -Wextra -Wpedantic -Werror -O2 -static -static-libgcc -static-libstdc++"
        else
          ${{ matrix.make }} CXXFLAGS="-std=c++17 -Wall -Wextra -Wpedantic -Werror -O2"
        fi

    - name: Rename artifact
      shell: bash
      run: mv cat_shell* ${{ matrix.artifact_name }}

    - name: Smoke test (non-Windows)
      if: runner.os != 'Windows'
      run: echo "exit" | ./${{ matrix.artifact_name }}

    - name: Prepare artifact folder
      shell: bash
      run: |
        mkdir -p dist
        mv ${{ matrix.artifact_name }} dist/

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}
        path: dist/*
        retention-days: 7

  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: binary-*
        path: release_assets
        merge-multiple: true

    - name: Update rolling tag
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -d rolling || true
        git push origin :refs/tags/rolling || true
        git tag rolling
        git push origin refs/tags/rolling --force

    - name: Upload binaries to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: rolling
        files: release_assets/*
        name: "Cat-Shell Rolling Build"
        body: "Automated build for Linux, Windows and macOS. The tag is updated on every push to main that touches source code."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
